<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6FA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClassBank" />
    <meta name="description" content="Class Contribution Transparency System" />
    <title>ClassBank</title>
    <script>
      // ── Service Worker cleanup ───────────────────────────────────────────────
      // Unregister any stale SW that belongs to a different origin (e.g. after a
      // domain change). This prevents Chrome's RESULT_CODE_KILLED_BAD_MESSAGE crash.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            // If the SW scope doesn't start with the current origin, kill it.
            if (reg.scope && !reg.scope.startsWith(location.origin)) {
              reg.unregister();
            }
          });
        }).catch(function() {});
      }
      // ────────────────────────────────────────────────────────────────────────

      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#0F172A');
        }

        // Clean up any legacy cached data from localStorage so everything is sourced strictly from database
        try {
          ['cb_app_logo', 'cb_app_name', 'classbank_landing_settings', 'classbank_recycle_bin_items'].forEach(function(k) {
            localStorage.removeItem(k);
          });
        } catch(e) {}

        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
